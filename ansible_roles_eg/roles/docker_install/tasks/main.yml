---
# tasks file for docker_install
# roles/docker_install/tasks/main.yml
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install Docker package
  ansible.builtin.apt:
    name: docker.io
    state: present

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes
